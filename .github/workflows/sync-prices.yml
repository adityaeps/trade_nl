name: Sync competitor prices

# Competitor price sync (ARCHITECTURE.md §7) - connects directly to the Neon
# database, not through the FastAPI app.
#
# MANUAL ONLY. The daily `schedule:` cron (03:17 UTC) was deliberately
# removed: the deployed API isn't up around the clock, and the business
# wants the sync run while someone is watching it rather than unattended
# overnight. Day-to-day it is triggered from the admin UI (Pricing > "Run
# price sync", which calls POST /api/v1/admin/price-sync). This workflow
# stays as the fallback path for when the API itself is down or asleep.
#
# To re-enable the schedule, restore:
#   schedule:
#     - cron: "17 3 * * *"
on:
  workflow_dispatch:
    inputs:
      missing_only:
        description: "Only sync devices that still have no base price"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run sync
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          python -m scripts.sync_competitor_prices \
            ${{ inputs.missing_only && '--missing-only' || '' }}

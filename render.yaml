# Render Blueprint - backend + database. The frontend deploys to Vercel
# (ARCHITECTURE.md §3), so it is deliberately absent here.
#
# Create from the Render dashboard: New > Blueprint > point at this repo.
# Secrets marked `sync: false` are NOT stored in git - Render prompts for
# them on first deploy.
#
# DEVIATION from ARCHITECTURE.md §3, decided 2026-08-16: Postgres is
# Render-managed rather than Neon, so the database and the API live on one
# provider. Nothing in the app depends on which one - `config.py` normalises
# the `postgresql://` URL either hands out to `postgresql+psycopg://`.
databases:
  - name: tradein-db
    databaseName: tradein
    user: tradein
    plan: free
    # WARNING: Render's free Postgres instances expire and are DELETED after
    # a fixed window (check the current term in the dashboard - it has been
    # 30 days recently). Nothing here backs that up. Move to a paid instance
    # before there is any real customer or payout data in it.

services:
  - type: web
    name: tradein-api
    runtime: python
    plan: free # §3: free for dev, upgrade to Starter before real traffic to avoid cold starts
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on start rather than as a preDeployCommand because
    # preDeploy is a paid-plan feature. `alembic upgrade head` is idempotent,
    # so re-running it on every restart/scale event is safe.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7" # §3 pins 3.12 for deploys; local dev used 3.14
      - key: DATABASE_URL
        # Wired from the managed instance above - no secret to paste, and it
        # follows the database if it is ever recreated.
        fromDatabase:
          name: tradein-db
          property: connectionString
      - key: ENCRYPTION_KEY
        # MUST stay stable for the life of the database: it decrypts
        # payouts.iban. Rotating it makes every stored IBAN unreadable, so
        # this is deliberately NOT auto-generated.
        sync: false
      - key: CORS_ORIGINS
        sync: false # the Vercel URL, e.g. https://trade-nl.vercel.app
      - key: JWT_SECRET
        generateValue: true # safe to rotate - only invalidates active admin sessions

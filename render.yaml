# Render Blueprint - backend only. The frontend deploys to Vercel and the
# database is Neon (ARCHITECTURE.md §3), so both are deliberately absent
# here.
#
# Create from the Render dashboard: New > Blueprint > point at this repo.
# Secrets marked `sync: false` are NOT stored in git - Render prompts for
# them on first deploy.
#
# History: a Render-managed Postgres was declared here on 2026-08-16 and
# removed the same day. It was migrated to Neon (EU/Frankfurt) because the
# free Render tier is deleted on expiry and has no backups, and because
# NL customer data - payouts.iban, contact details - should sit in the EU.
# Nothing in the app depends on the provider: config.py normalises whatever
# `postgresql://` URL it is given to `postgresql+psycopg://`.
services:
  - type: web
    name: tradein-api
    runtime: python
    plan: free # §3: free for dev, upgrade to Starter before real traffic to avoid cold starts
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on start rather than as a preDeployCommand because
    # preDeploy is a paid-plan feature. `alembic upgrade head` is idempotent,
    # so re-running it on every restart/scale event is safe.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7" # §3 pins 3.12 for deploys; local dev used 3.14
      - key: DATABASE_URL
        # Neon connection string (EU/Frankfurt), pasted on first deploy.
        # Keep `?sslmode=require` on the end - Neon rejects plaintext.
        sync: false
      - key: ENCRYPTION_KEY
        # MUST stay stable for the life of the database: it decrypts
        # payouts.iban. Rotating it makes every stored IBAN unreadable, so
        # this is deliberately NOT auto-generated.
        sync: false
      - key: CORS_ORIGINS
        sync: false # the Vercel URL, e.g. https://trade-nl.vercel.app
      - key: JWT_SECRET
        generateValue: true # safe to rotate - only invalidates active admin sessions
